name: Inspect LRCLIB DB Dump

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 python3-pip
          pip install --user --break-system-packages rapidgzip apsw
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 -c "import rapidgzip; import apsw; print('rapidgzip + apsw OK')"

      - name: Download DB dump
        run: |
          echo "=== DOWNLOAD ==="
          aria2c -x 16 -s 16 -o lrclib.sqlite3.gz \
            "https://db-dumps.lrclib.net/lrclib-db-dump-20260807T082319Z.sqlite3.gz"
          echo "=== DOWNLOADED ==="
          ls -lh lrclib.sqlite3.gz
          df -h /

      - name: Inspect DB via RapidgzipFile + APSW VFS
        run: |
          python3 scripts/inspect_export.py lrclib.sqlite3.gz

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: db-inspection-report
          path: db_inspection_report.json

      - name: Final disk space
        run: df -h /

      - name: Cleanup
        if: always()
        run: |
          rm -f lrclib.sqlite3.gz
          df -h /

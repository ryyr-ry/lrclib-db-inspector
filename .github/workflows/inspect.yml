name: Inspect LRCLIB DB Dump

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Maximize disk space
        run: |
          echo "=== BEFORE ==="
          df -h /
          sudo rm -rf \
            /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/lib/node_modules \
            /usr/share/swift /usr/share/miniconda \
            /usr/local/aws-cli /usr/local/aws-sam-cli \
            /usr/share/gradle /usr/local/julia \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/share/az* /opt/az /opt/google /opt/pipx \
            /usr/share/doc /usr/share/man /usr/share/info \
            /usr/share/locale /usr/lib/locale \
            /usr/share/i18n /usr/share/terminfo \
            /var/lib/apt/lists/* /var/log /var/tmp /tmp/* /snap /mnt \
            2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          echo "=== AFTER ==="
          df -h /

      - name: Install rapidgzip
        run: |
          python3 -m pip install --user --break-system-packages rapidgzip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download DB dump
        run: |
          echo "=== DOWNLOAD ==="
          aria2c -x 16 -s 16 -o lrclib.sqlite3.gz \
            "https://db-dumps.lrclib.net/lrclib-db-dump-20260807T082319Z.sqlite3.gz"
          echo "=== DOWNLOADED ==="
          ls -lh lrclib.sqlite3.gz
          stat -c %s lrclib.sqlite3.gz
          df -h /

      - name: Measure decompressed size (no disk write)
        run: |
          echo "=== MEASURING DECOMPRESSED SIZE ==="
          echo "Piping rapidgzip -> wc -c (no disk write for decompressed data)"
          START=$(date +%s)
          BYTES=$(rapidgzip -d -c -P 0 lrclib.sqlite3.gz | wc -c)
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "=== RESULT ==="
          echo "Decompressed size: $BYTES bytes"
          echo "Decompressed size: $((BYTES / 1073741824)) GiB"
          echo "Decompressed size: $((BYTES / 1000000000)) GB (decimal)"
          echo "Elapsed: ${ELAPSED}s"
          echo "Throughput: $((BYTES / ELAPSED / 1048576)) MiB/s"
          echo "Compression ratio: $(echo "scale=2; $BYTES / $(stat -c %s lrclib.sqlite3.gz)" | bc -l)x"
          df -h /

      - name: Cleanup
        if: always()
        run: |
          rm -f lrclib.sqlite3.gz
          df -h /
